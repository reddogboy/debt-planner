<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debt Destroyer - แผนปลดหนี้อัจฉริยะ</title>
    <!-- โหลด React, Recharts, Babel และ Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .toast-enter { animation: slideInRight 0.3s ease-out forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-bg { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Legend } = window.Recharts;

        // --- ฟังก์ชันช่วยเหลือ (Formatters) ---
        const formatMoney = (amount) => "฿" + Math.round(amount).toLocaleString("th-TH");
        const parseMoneyInput = (val) => val.replace(/,/g, '').replace(/[^0-9.]/g, '');
        const formatMoneyInput = (val) => {
            if (!val) return "";
            const num = parseMoneyInput(val);
            if (isNaN(num) || num === "") return "";
            return Number(num).toLocaleString('th-TH');
        };

        const getAbsoluteDate = (monthsAdded) => {
            if (monthsAdded >= 600) return "ไม่มีกำหนด (หนี้พอก)";
            const d = new Date();
            d.setMonth(d.getMonth() + monthsAdded);
            return d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
        };

        // --- Core Engine: จำลองการจ่ายหนี้และสร้างประวัติสำหรับกราฟ ---
        const simulatePayoff = (debts, extraPayment, strategy) => {
            if (debts.length === 0) return { months: 0, totalInterest: 0, isInfinite: false, history: [], schedule: [] };

            let currentDebts = debts.map(d => ({ ...d }));
            
            if (strategy === 'snowball') currentDebts.sort((a, b) => a.balance - b.balance);
            else if (strategy === 'avalanche') currentDebts.sort((a, b) => b.rate - a.rate);

            let totalMonths = 0;
            let totalInterestPaid = 0;
            let isInfinite = false;
            let history = [currentDebts.reduce((sum, d) => sum + d.balance, 0)];
            let schedule = [];

            while (currentDebts.length > 0 && totalMonths < 600) {
                totalMonths++;
                let monthlyExtraBudget = strategy === 'minimum' ? 0 : extraPayment;
                let monthLog = { month: totalMonths, actions: [] };

                // 1. คิดดอกเบี้ยและจ่ายขั้นต่ำ
                for (let i = 0; i < currentDebts.length; i++) {
                    let debt = currentDebts[i];
                    let interest = debt.balance * (debt.rate / 100) / 12;
                    totalInterestPaid += interest;
                    debt.balance += interest; 

                    let payment = Math.min(debt.minPayment, debt.balance);
                    debt.balance -= payment;
                    monthLog.actions.push({ name: debt.name, paid: payment, interest: interest });

                    if (debt.balance <= 0) {
                        monthlyExtraBudget += (debt.minPayment - payment); 
                        monthlyExtraBudget += debt.minPayment; 
                    }
                }

                currentDebts = currentDebts.filter(d => d.balance > 0);

                // 2. โปะพิเศษ
                if (currentDebts.length > 0 && monthlyExtraBudget > 0) {
                    let targetDebt = currentDebts[0];
                    let payoff = Math.min(monthlyExtraBudget, targetDebt.balance);
                    targetDebt.balance -= payoff;
                    
                    let action = monthLog.actions.find(a => a.name === targetDebt.name);
                    if (action) action.paid += payoff;
                    
                    if (targetDebt.balance <= 0) {
                         currentDebts = currentDebts.filter(d => d.balance > 0);
                    }
                }

                history.push(currentDebts.reduce((sum, d) => sum + d.balance, 0));
                schedule.push(monthLog);
            }

            if (totalMonths >= 600) isInfinite = true;
            return { months: totalMonths, totalInterest: totalInterestPaid, isInfinite, history, schedule };
        };

        function App() {
            // States
            const [debts, setDebts] = useState(() => JSON.parse(localStorage.getItem('dd2_debts')) || []);
            const [extraPay, setExtraPay] = useState(() => localStorage.getItem('dd2_extra') || "");
            
            const [name, setName] = useState("");
            const [balance, setBalance] = useState("");
            const [rate, setRate] = useState("");
            const [minPayment, setMinPayment] = useState("");
            
            const [editingId, setEditingId] = useState(null);
            const [toast, setToast] = useState(null);
            const [deleteTarget, setDeleteTarget] = useState(null);
            const [showSchedule, setShowSchedule] = useState(false);

            useEffect(() => {
                localStorage.setItem('dd2_debts', JSON.stringify(debts));
                localStorage.setItem('dd2_extra', extraPay);
            }, [debts, extraPay]);

            // จำลองลอจิกทั้ง 3 แบบ
            const results = useMemo(() => {
                const extra = Number(parseMoneyInput(extraPay)) || 0;
                return {
                    minimum: simulatePayoff(debts, 0, 'minimum'),
                    snowball: simulatePayoff(debts, extra, 'snowball'),
                    avalanche: simulatePayoff(debts, extra, 'avalanche')
                };
            }, [debts, extraPay]);

            // สร้าง Data สำหรับ Chart
            const chartData = useMemo(() => {
                if (debts.length === 0) return [];
                const maxMonths = Math.min(results.minimum.isInfinite ? 120 : results.minimum.months, 120); // โชว์กราฟสูงสุด 10 ปีเพื่อไม่ให้รก
                let data = [];
                const d = new Date();
                for (let i = 0; i <= maxMonths; i++) {
                    let labelDate = new Date(d.getFullYear(), d.getMonth() + i, 1);
                    data.push({
                        name: labelDate.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }),
                        "ขั้นต่ำ": results.minimum.history[i] || 0,
                        "Snowball": results.snowball.history[i] || 0,
                        "Avalanche": results.avalanche.history[i] || 0
                    });
                }
                return data;
            }, [results, debts.length]);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const numBal = Number(parseMoneyInput(balance));
                const numRate = Number(parseMoneyInput(rate));
                const numMin = Number(parseMoneyInput(minPayment));

                if (!name || !numBal || !numRate || !numMin) return;

                const firstMonthInterest = numBal * (numRate / 100) / 12;
                if (numMin <= firstMonthInterest) {
                    showToast(`คำเตือน: จ่ายขั้นต่ำน้อยกว่าดอกเบี้ย (฿${Math.round(firstMonthInterest)})! หนี้ก้อนนี้จะพอก`, 'error');
                } else {
                    showToast(editingId ? "บันทึกการแก้ไขแล้ว" : "เพิ่มรายการหนี้แล้ว");
                }

                if (editingId) {
                    setDebts(debts.map(d => d.id === editingId ? { id: editingId, name, balance: numBal, rate: numRate, minPayment: numMin } : d));
                    setEditingId(null);
                } else {
                    setDebts([...debts, { id: Date.now(), name, balance: numBal, rate: numRate, minPayment: numMin }]);
                }
                
                setName(""); setBalance(""); setRate(""); setMinPayment("");
            };

            const handleEdit = (d) => {
                setEditingId(d.id);
                setName(d.name);
                setBalance(formatMoneyInput(d.balance.toString()));
                setRate(d.rate.toString());
                setMinPayment(formatMoneyInput(d.minPayment.toString()));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const confirmDelete = () => {
                setDebts(debts.filter(d => d.id !== deleteTarget.id));
                setDeleteTarget(null);
                showToast("ลบรายการหนี้แล้ว");
            };

            const totalDebtBalance = debts.reduce((sum, d) => sum + d.balance, 0);

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-6 relative">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-xl shadow-lg font-bold text-white toast-enter ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
                            {toast.msg}
                        </div>
                    )}

                    {/* Delete Confirm Modal */}
                    {deleteTarget && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm modal-bg">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-xl font-bold text-gray-900 mb-2">ลบรายการหนี้?</h3>
                                <p className="text-gray-500 mb-6">คุณแน่ใจหรือไม่ที่จะลบรายการ "{deleteTarget.name}" ข้อมูลนี้ไม่สามารถกู้คืนได้</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteTarget(null)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 rounded-xl transition">ยกเลิก</button>
                                    <button onClick={confirmDelete} className="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-xl transition">ลบทิ้ง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Schedule Modal */}
                    {showSchedule && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm modal-bg">
                            <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[80vh] flex flex-col shadow-2xl">
                                <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                                    <h3 className="text-lg font-bold text-gray-800">🗓️ ตารางผ่อนชำระ (แผน Avalanche)</h3>
                                    <button onClick={() => setShowSchedule(false)} className="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr className="border-b-2 border-gray-200 text-gray-600">
                                                <th className="py-2">เดือนที่</th>
                                                <th className="py-2">ยอดรวมที่จ่าย</th>
                                                <th className="py-2">ดอกเบี้ยรวม</th>
                                                <th className="py-2">รายละเอียดแยกก้อน</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {results.avalanche.schedule.map((month, idx) => {
                                                const totalPaid = month.actions.reduce((s, a) => s + a.paid, 0);
                                                const totalInt = month.actions.reduce((s, a) => s + a.interest, 0);
                                                return (
                                                    <tr key={idx} className="border-b border-gray-100 hover:bg-gray-50">
                                                        <td className="py-3 font-bold text-gray-700">{idx + 1}</td>
                                                        <td className="py-3 text-blue-600 font-bold">{formatMoney(totalPaid)}</td>
                                                        <td className="py-3 text-red-500">{formatMoney(totalInt)}</td>
                                                        <td className="py-3 text-xs text-gray-500">
                                                            {month.actions.map((a, i) => (
                                                                <div key={i}>{a.name}: จ่าย {formatMoney(a.paid)}</div>
                                                            ))}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ฝั่งซ้าย: Form & Inputs */}
                    <div className="w-full lg:w-4/12 space-y-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                            <h1 className="text-2xl font-black text-gray-800 mb-1">💥 Debt Destroyer</h1>
                            <p className="text-xs text-green-600 font-bold bg-green-50 p-2 rounded-lg mb-4 inline-block">🔒 ข้อมูลส่วนตัวของคุณถูกคำนวณบนเครื่องนี้เท่านั้น</p>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">ชื่อรายการหนี้</label>
                                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold text-gray-800" placeholder="เช่น บัตรเครดิต KTC" required />
                                </div>
                                <div className="flex gap-3">
                                    <div className="w-1/2">
                                        <label className="block text-xs font-bold text-gray-600 mb-1">ยอดคงเหลือ (฿)</label>
                                        <input type="text" inputMode="numeric" value={balance} onChange={e => setBalance(formatMoneyInput(e.target.value))} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold text-gray-800" placeholder="50,000" required />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-xs font-bold text-gray-600 mb-1">ดอกเบี้ยต่อปี (%)</label>
                                        <input type="text" inputMode="numeric" value={rate} onChange={e => setRate(parseMoneyInput(e.target.value))} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold text-gray-800" placeholder="16" required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-600 mb-1">ยอดจ่ายขั้นต่ำ (฿)</label>
                                    <input type="text" inputMode="numeric" value={minPayment} onChange={e => setMinPayment(formatMoneyInput(e.target.value))} className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-bold text-gray-800" placeholder="5,000" required />
                                </div>
                                <div className="flex gap-2">
                                    {editingId && <button type="button" onClick={() => {setEditingId(null); setName(""); setBalance(""); setRate(""); setMinPayment("");}} className="w-1/3 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300 transition text-sm">ยกเลิก</button>}
                                    <button type="submit" className={`${editingId ? 'w-2/3 bg-blue-600 hover:bg-blue-700' : 'w-full bg-gray-900 hover:bg-gray-800'} text-white font-bold py-3 rounded-xl transition text-sm shadow-md`}>
                                        {editingId ? '💾 บันทึกการแก้ไข' : '+ เพิ่มรายการหนี้'}
                                    </button>
                                </div>
                            </form>
                        </div>

                        {/* งบโปะพิเศษ (ย้ายมาฝั่งซ้าย) */}
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-5 rounded-2xl shadow-md text-white">
                            <h2 className="text-sm font-bold mb-1">✨ กระสุนโปะพิเศษต่อเดือน</h2>
                            <p className="text-xs text-blue-200 mb-3">เงินที่คุณจะจ่ายเพิ่มนอกเหนือจากขั้นต่ำ</p>
                            <div className="flex items-center">
                                <span className="text-xl font-bold mr-2">฿</span>
                                <input type="text" inputMode="numeric" value={extraPay} onChange={e => setExtraPay(formatMoneyInput(e.target.value))} className="w-full p-2 bg-blue-800/50 border border-blue-400 rounded-lg text-xl font-black focus:ring-2 focus:ring-white outline-none placeholder-blue-300/50" placeholder="เช่น 2,000" />
                            </div>
                        </div>

                        {/* List */}
                        {debts.length > 0 && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                <h2 className="text-sm font-bold text-gray-800 mb-3">รายการหนี้ ({debts.length})</h2>
                                <div className="space-y-2">
                                    {debts.map(d => (
                                        <div key={d.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-200">
                                            <div>
                                                <p className="font-bold text-sm text-gray-800">{d.name}</p>
                                                <p className="text-xs text-gray-500">{formatMoney(d.balance)} @ {d.rate}%</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => handleEdit(d)} className="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition" title="แก้ไข">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                                </button>
                                                <button onClick={() => setDeleteTarget(d)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition" title="ลบ">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* ฝั่งขวา: Results & Charts */}
                    <div className="w-full lg:w-8/12 space-y-4">
                        {debts.length > 0 ? (
                            <>
                                {/* Direct Comparison Hero Card */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
                                        <h2 className="text-xl font-black text-gray-800">ผลวิเคราะห์แผนปลดหนี้</h2>
                                        <div className="text-right">
                                            <p className="text-xs text-gray-500">หนี้รวมปัจจุบัน</p>
                                            <p className="text-xl font-black text-red-600">{formatMoney(totalDebtBalance)}</p>
                                        </div>
                                    </div>

                                    {results.minimum.isInfinite ? (
                                        <div className="bg-red-50 border-2 border-red-500 p-6 rounded-xl text-center shadow-inner">
                                            <span className="text-4xl mb-2 block">🚨</span>
                                            <h3 className="text-xl font-black text-red-700 mb-2">สภาวะหนี้พอกหางหมู!</h3>
                                            <p className="text-red-600 font-bold mb-4">ยอดที่คุณจ่ายขั้นต่ำ น้อยกว่าดอกเบี้ยที่เพิ่มขึ้น หนี้จะไม่มีวันหมด!</p>
                                            <p className="text-sm text-gray-700">คำแนะนำ: จำเป็นต้องเพิ่ม "กระสุนโปะพิเศษ" ด่วนครับ</p>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col md:flex-row gap-4">
                                            {/* กรณีที่ 1: ขั้นต่ำ */}
                                            <div className="flex-1 p-5 rounded-xl border-2 border-gray-200 bg-gray-50 opacity-80">
                                                <h3 className="font-bold text-gray-600 mb-1">จ่ายขั้นต่ำไปเรื่อยๆ</h3>
                                                <p className="text-xs text-gray-500 mb-4">ไม่มีกระสุนพิเศษ</p>
                                                <div className="space-y-3">
                                                    <div>
                                                        <p className="text-xs text-gray-500">อิสรภาพของคุณคือ</p>
                                                        <p className="font-black text-lg text-gray-800">{getAbsoluteDate(results.minimum.months)}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-xs text-gray-500">เสียดอกเบี้ยรวมให้ธนาคาร</p>
                                                        <p className="font-black text-lg text-red-500">{formatMoney(results.minimum.totalInterest)}</p>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* VS Badge */}
                                            <div className="hidden md:flex items-center justify-center -mx-6 z-10">
                                                <div className="bg-gray-900 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">VS</div>
                                            </div>

                                            {/* กรณีที่ 2: Avalanche */}
                                            <div className="flex-1 p-5 rounded-xl border-2 border-green-400 bg-green-50 shadow-md relative overflow-hidden transform scale-100 md:scale-105">
                                                <div className="absolute top-0 right-0 bg-green-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg shadow-sm">ประหยัดสุด (Avalanche)</div>
                                                <h3 className="font-bold text-green-800 mb-1">แผนทำลายล้างหนี้</h3>
                                                <p className="text-xs text-green-600 mb-4">โปะดอกแพงสุดก่อน + งบ {extraPay || "0"} ฿</p>
                                                <div className="space-y-3">
                                                    <div>
                                                        <p className="text-xs text-green-700">อิสรภาพของคุณคือ</p>
                                                        <p className="font-black text-2xl text-green-700">{getAbsoluteDate(results.avalanche.months)}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-xs text-green-700">เสียดอกเบี้ยลดลงเหลือ</p>
                                                        <p className="font-black text-xl text-green-700">{formatMoney(results.avalanche.totalInterest)}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Direct Impact Alert */}
                                    {!results.minimum.isInfinite && (
                                        <div className="mt-6 text-center p-4 bg-gray-900 text-white rounded-xl shadow-md">
                                            <p className="font-bold text-yellow-400 text-lg">
                                                คุณจะเป็นไทเร็วขึ้น {results.minimum.months - results.avalanche.months} เดือน!
                                            </p>
                                            <p className="text-sm mt-1 text-gray-300">
                                                และเอาเงินทอนจากดอกเบี้ยคืนมาได้ถึง <span className="font-bold text-white bg-green-500/20 px-2 py-0.5 rounded">{formatMoney(results.minimum.totalInterest - results.avalanche.totalInterest)}</span>
                                            </p>
                                        </div>
                                    )}
                                </div>

                                {/* กราฟเส้น (Visual Impact) */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-4">
                                        <div>
                                            <h3 className="font-bold text-gray-800">📉 กราฟเส้นทางสู่อิสรภาพ</h3>
                                            <p className="text-xs text-gray-500">เส้นไหนแตะศูนย์ก่อน เส้นนั้นชนะ</p>
                                        </div>
                                        <button onClick={() => setShowSchedule(true)} className="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-3 py-2 rounded-lg transition border border-blue-200">
                                            📄 ดูตารางผ่อนชำระ
                                        </button>
                                    </div>
                                    
                                    <div className="h-[250px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <LineChart data={chartData} margin={{ top: 5, right: 10, left: 10, bottom: 5 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="name" tick={{fontSize: 10, fill: '#64748b'}} tickLine={false} axisLine={{stroke: '#e2e8f0'}} />
                                                <YAxis tickFormatter={(val) => `฿${(val/1000)}k`} tick={{fontSize: 10, fill: '#64748b'}} tickLine={false} axisLine={false} width={40} />
                                                <Tooltip formatter={(value) => formatMoney(value)} contentStyle={{borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}} />
                                                <Legend wrapperStyle={{fontSize: '11px', paddingTop: '10px'}} />
                                                <Line type="monotone" dataKey="ขั้นต่ำ" stroke="#ef4444" strokeWidth={2} dot={false} />
                                                <Line type="monotone" dataKey="Snowball" stroke="#f59e0b" strokeWidth={2} dot={false} strokeDasharray="5 5" />
                                                <Line type="monotone" dataKey="Avalanche" stroke="#10b981" strokeWidth={3} dot={false} />
                                            </LineChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="bg-white p-12 rounded-2xl shadow-sm border border-gray-200 text-center border-dashed border-2 h-full flex flex-col items-center justify-center">
                                <span className="text-5xl mb-4 opacity-50">📝</span>
                                <h3 className="text-xl font-bold text-gray-700 mb-2">สร้างพิมพ์เขียวสู่อิสรภาพ</h3>
                                <p className="text-gray-500 max-w-sm">กรอกรายการหนี้ทางฝั่งซ้าย เพื่อให้ระบบวิเคราะห์และสร้างแผนปลดหนี้ที่ประหยัดเวลาและดอกเบี้ยที่สุดให้คุณ</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
