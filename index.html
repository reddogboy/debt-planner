<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debt Planner - โปรแกรมคำนวณแผนปลดหนี้</title>
    
    <!-- 1. โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. โหลด React & ReactDOM (ล็อคเวอร์ชัน 18.2.0 เสถียรที่สุด) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    <!-- 3. โหลด Recharts สำหรับวาดกราฟ -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>

    <!-- 4. โหลด Babel สำหรับแปลงโค้ด JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-anim { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, Legend, ReferenceLine } = Recharts;

        const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

        const formatMoney = (amount) => "฿" + Math.round(amount).toLocaleString("th-TH");
        
        const getAbsoluteDate = (monthsAdded) => {
            if (monthsAdded >= 600) return "ไม่มีวันหมด";
            const d = new Date();
            d.setMonth(d.getMonth() + monthsAdded);
            return d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
        };
        
        const formatMonthsDuration = (months) => {
            if (months >= 600) return "ไม่มีวันหมด";
            const y = Math.floor(months / 12);
            const m = months % 12;
            if (y === 0) return `${m} เดือน`;
            if (m === 0) return `${y} ปี`;
            return `${y} ปี ${m} เดือน`;
        };

        // --- Core Engine: รองรับทั้ง Minimum, Snowball, และ Avalanche ---
        const simulatePayoff = (debts, extraPayment, strategy) => {
            if (debts.length === 0) return { months: 0, totalInterest: 0, isInfinite: false, history: [] };

            let currentDebts = debts.map(d => ({ ...d }));
            
            // เรียงลำดับตามกลยุทธ์
            if (strategy === 'snowball') currentDebts.sort((a, b) => a.balance - b.balance);
            else if (strategy === 'avalanche') currentDebts.sort((a, b) => b.rate - a.rate);

            let totalMonths = 0;
            let totalInterestPaid = 0;
            let isInfinite = false;
            let balanceHistory = [currentDebts.reduce((sum, d) => sum + d.balance, 0)];

            while (currentDebts.length > 0 && totalMonths < 600) {
                totalMonths++;
                let monthlyExtraBudget = strategy === 'minimum' ? 0 : extraPayment;

                for (let i = 0; i < currentDebts.length; i++) {
                    let debt = currentDebts[i];
                    let interest = debt.balance * (debt.rate / 100) / 12;
                    totalInterestPaid += interest;
                    debt.balance += interest;

                    let payment = Math.min(debt.minPayment, debt.balance);
                    debt.balance -= payment;

                    if (debt.balance <= 0) {
                        monthlyExtraBudget += (debt.minPayment - payment);
                        monthlyExtraBudget += debt.minPayment;
                    }
                }

                currentDebts = currentDebts.filter(d => d.balance > 0);

                if (currentDebts.length > 0 && monthlyExtraBudget > 0) {
                    let targetDebt = currentDebts[0];
                    let payoff = Math.min(monthlyExtraBudget, targetDebt.balance);
                    targetDebt.balance -= payoff;
                    if (targetDebt.balance <= 0) currentDebts = currentDebts.filter(d => d.balance > 0);
                }
                
                balanceHistory.push(currentDebts.reduce((sum, d) => sum + d.balance, 0));
            }

            if (totalMonths >= 600) isInfinite = true;
            return { months: totalMonths, totalInterest: totalInterestPaid, isInfinite, history: balanceHistory };
        };

        function App() {
            const [debts, setDebts] = useState(() => JSON.parse(localStorage.getItem('dd_debts')) || []);
            const [extraPayStr, setExtraPayStr] = useState(() => localStorage.getItem('dd_extra') || "");
            
            const [editingId, setEditingId] = useState(null);
            const [name, setName] = useState("");
            const [balanceStr, setBalanceStr] = useState("");
            const [rateStr, setRateStr] = useState("");
            const [minPaymentStr, setMinPaymentStr] = useState("");

            const [toast, setToast] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            useEffect(() => {
                localStorage.setItem('dd_debts', JSON.stringify(debts));
                localStorage.setItem('dd_extra', extraPayStr.replace(/,/g, ''));
            }, [debts, extraPayStr]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const handleNumberInput = (setter) => (e) => {
                const rawValue = e.target.value.replace(/[^0-9.]/g, '');
                if (rawValue === "") { setter(""); return; }
                const parts = rawValue.split('.');
                parts[0] = Number(parts[0]).toLocaleString('en-US'); 
                setter(parts.join('.'));
            };

            const getNum = (str) => Number(String(str).replace(/,/g, '')) || 0;

            const results = useMemo(() => {
                const extraVal = getNum(extraPayStr);
                return {
                    minimum: simulatePayoff(debts, 0, 'minimum'),
                    snowball: simulatePayoff(debts, extraVal, 'snowball'),
                    avalanche: simulatePayoff(debts, extraVal, 'avalanche')
                };
            }, [debts, extraPayStr]);

            const chartData = useMemo(() => {
                if (debts.length === 0) return [];
                const maxLen = Math.max(
                    results.minimum.history.length, 
                    results.snowball.history.length, 
                    results.avalanche.history.length
                );
                let data = [];
                const step = Math.max(1, Math.ceil(maxLen / 100));
                
                for(let i=0; i < maxLen; i+=step) {
                    data.push({
                        month: i,
                        "จ่ายขั้นต่ำ": results.minimum.history[i] !== undefined ? Math.round(results.minimum.history[i]) : 0,
                        "Snowball (ก้อนเล็ก)": results.snowball.history[i] !== undefined ? Math.round(results.snowball.history[i]) : 0,
                        "Avalanche (ดอกแพง)": results.avalanche.history[i] !== undefined ? Math.round(results.avalanche.history[i]) : 0
                    });
                }
                return data;
            }, [results, debts]);

            const handleSubmit = (e) => {
                e.preventDefault();
                const bal = getNum(balanceStr);
                const rt = getNum(rateStr);
                const minP = getNum(minPaymentStr);
                
                if (!name || bal <= 0 || rt < 0 || minP <= 0) {
                    showToast("กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง", "error");
                    return;
                }

                const firstMonthInterest = bal * (rt / 100) / 12;
                if (minP <= firstMonthInterest) {
                    showToast(`⚠️ ยอดจ่ายขั้นต่ำน้อยกว่าดอกเบี้ย (฿${Math.round(firstMonthInterest)}) หนี้ไม่มีวันลด!`, "error");
                }

                if (editingId) {
                    setDebts(debts.map(d => d.id === editingId ? { id: editingId, name, balance: bal, rate: rt, minPayment: minP } : d));
                    showToast("อัปเดตข้อมูลหนี้เรียบร้อย");
                    setEditingId(null);
                } else {
                    setDebts([...debts, { id: Date.now(), name, balance: bal, rate: rt, minPayment: minP }]);
                    showToast("เพิ่มรายการหนี้สำเร็จ");
                }
                
                setName(""); setBalanceStr(""); setRateStr(""); setMinPaymentStr("");
            };

            const startEdit = (debt) => {
                setEditingId(debt.id);
                setName(debt.name);
                setBalanceStr(debt.balance.toLocaleString('en-US'));
                setRateStr(debt.rate.toString());
                setMinPaymentStr(debt.minPayment.toLocaleString('en-US'));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const confirmDelete = (id) => setDeleteConfirm(id);

            const executeDelete = () => {
                setDebts(debts.filter(d => d.id !== deleteConfirm));
                setDeleteConfirm(null);
                showToast("ลบรายการหนี้แล้ว");
                if (editingId === deleteConfirm) {
                    setEditingId(null);
                    setName(""); setBalanceStr(""); setRateStr(""); setMinPaymentStr("");
                }
            };

            const totalDebtBalance = debts.reduce((sum, d) => sum + d.balance, 0);

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-8 pb-24">
                    
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 flex items-center p-4 rounded-xl shadow-xl text-white font-bold toast-enter ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                            {toast.type === 'error' ? <AlertIcon /> : '✅'}
                            <span className="ml-2">{toast.message}</span>
                        </div>
                    )}

                    {deleteConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 modal-anim text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🗑️</div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">ลบรายการหนี้นี้?</h3>
                                <p className="text-sm text-gray-500 mb-6">คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้ ไม่สามารถกู้คืนได้นะ</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition">ยกเลิก</button>
                                    <button onClick={executeDelete} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition">ลบทิ้ง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ฝั่งซ้าย: Form */}
                    <div className="w-full lg:w-5/12 space-y-6">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h1 className="text-2xl font-black text-slate-800 mb-1">💸 Debt Planner 🕊️</h1>
                            <p className="text-xs text-slate-500 mb-6 flex items-center">
                                <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded mr-2 font-bold">100% Private</span>
                                คำนวณบนเครื่องคุณ ไม่ส่งข้อมูลออกไปที่อื่น
                            </p>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">ชื่อรายการหนี้</label>
                                    <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="เช่น บัตร KTC, ผ่อนรถ" required />
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-1/2">
                                        <label className="block text-sm font-bold text-slate-700 mb-1">ยอดคงเหลือ (฿)</label>
                                        <input type="text" inputMode="numeric" value={balanceStr} onChange={handleNumberInput(setBalanceStr)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition font-semibold" placeholder="0" required />
                                    </div>
                                    <div className="w-1/2">
                                        <label className="block text-sm font-bold text-slate-700 mb-1">ดอกเบี้ยต่อปี (%)</label>
                                        <input type="text" inputMode="decimal" value={rateStr} onChange={handleNumberInput(setRateStr)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition font-semibold" placeholder="16.0" required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">ยอดจ่ายขั้นต่ำต่อเดือน (฿)</label>
                                    <input type="text" inputMode="numeric" value={minPaymentStr} onChange={handleNumberInput(setMinPaymentStr)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition font-semibold" placeholder="0" required />
                                </div>
                                
                                {editingId ? (
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => { setEditingId(null); setName(""); setBalanceStr(""); setRateStr(""); setMinPaymentStr(""); }} className="w-1/3 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition">ยกเลิก</button>
                                        <button type="submit" className="w-2/3 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200">💾 บันทึกการแก้ไข</button>
                                    </div>
                                ) : (
                                    <button type="submit" className="w-full mt-2 bg-slate-900 text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition shadow-lg shadow-slate-200">
                                        + เพิ่มรายการหนี้
                                    </button>
                                )}
                            </form>
                        </div>

                        {debts.length > 0 && (
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center justify-between">
                                    <span>หนี้ของคุณ ({debts.length})</span>
                                    <span className="text-sm font-black text-rose-500">{formatMoney(totalDebtBalance)}</span>
                                </h2>
                                <div className="space-y-3">
                                    {debts.map(d => (
                                        <div key={d.id} className={`flex justify-between items-center p-4 rounded-2xl border transition-all ${editingId === d.id ? 'bg-blue-50 border-blue-200 shadow-inner' : 'bg-slate-50 border-slate-200 hover:border-slate-300'}`}>
                                            <div>
                                                <p className="font-bold text-slate-800">{d.name}</p>
                                                <p className="text-xs text-slate-500 mt-0.5">{formatMoney(d.balance)} • ดอก {d.rate}% • ผ่อน {formatMoney(d.minPayment)}/ด</p>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => startEdit(d)} className="p-2 text-blue-500 hover:bg-blue-100 rounded-lg transition" title="แก้ไข"><EditIcon /></button>
                                                <button onClick={() => confirmDelete(d.id)} className="p-2 text-rose-500 hover:bg-rose-100 rounded-lg transition" title="ลบ"><TrashIcon /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* ฝั่งขวา: Dashboard */}
                    <div className="w-full lg:w-7/12 space-y-6">
                        
                        <div className="bg-gradient-to-br from-indigo-600 to-blue-700 p-6 rounded-3xl shadow-xl shadow-blue-900/20 text-white relative overflow-hidden">
                            <h2 className="text-lg font-bold mb-1 text-blue-50">🔥 เงินพิเศษสำหรับโปะหนี้ (ต่อเดือน)</h2>
                            <p className="text-xs text-blue-200 mb-4">จ่ายเพิ่มจากขั้นต่ำปกติ เพื่อทำลายวงจรดอกเบี้ยนรก</p>
                            <div className="flex items-center bg-blue-800/50 p-2 rounded-2xl border border-blue-500/30 backdrop-blur-md">
                                <span className="text-2xl font-bold ml-4 mr-2 text-blue-200">฿</span>
                                <input 
                                    type="text" 
                                    inputMode="numeric"
                                    value={extraPayStr} 
                                    onChange={handleNumberInput(setExtraPayStr)} 
                                    className="w-full p-2 bg-transparent border-none text-3xl font-black text-white focus:ring-0 outline-none placeholder-blue-400" 
                                    placeholder="เช่น 1,000"
                                />
                            </div>
                        </div>

                        {debts.length > 0 ? (
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                                <h2 className="text-xl font-black text-slate-800 pb-2 border-b border-slate-100">เปรียบเทียบกลยุทธ์</h2>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    
                                    {/* จ่ายขั้นต่ำ */}
                                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col justify-between">
                                        <div>
                                            <h3 className="font-bold text-slate-700 mb-1 text-sm">😭 จ่ายขั้นต่ำ</h3>
                                            <p className="text-[11px] text-slate-500 mb-3">ไม่โปะเพิ่มเลย</p>
                                        </div>
                                        {results.minimum.isInfinite ? (
                                            <div className="bg-rose-100 text-rose-700 p-2 rounded-xl text-xs font-bold">หนี้ไม่มีวันหมด!</div>
                                        ) : (
                                            <div>
                                                <p className="text-[10px] uppercase font-bold text-slate-400">หมดหนี้ใน</p>
                                                <p className="font-black text-sm text-slate-800">{getAbsoluteDate(results.minimum.months)}</p>
                                                <p className="text-[10px] text-rose-500 font-bold mt-1">ดอกเบี้ย: {formatMoney(results.minimum.totalInterest)}</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Snowball (เพิ่มกลับเข้ามาตามคำขอ) */}
                                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 flex flex-col justify-between">
                                        <div>
                                            <h3 className="font-bold text-amber-800 mb-1 text-sm">⛄ Snowball</h3>
                                            <p className="text-[11px] text-amber-600 mb-3">โปะก้อนเล็กก่อน (มีกำลังใจ)</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] uppercase font-bold text-amber-600/70">หมดหนี้ใน</p>
                                            <p className="font-black text-sm text-amber-800">{getAbsoluteDate(results.snowball.months)}</p>
                                            <p className="text-[10px] text-amber-700 font-bold mt-1">ดอกเบี้ย: {formatMoney(results.snowball.totalInterest)}</p>
                                        </div>
                                    </div>

                                    {/* Avalanche */}
                                    <div className="p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-400 relative overflow-hidden shadow-md">
                                        <div className="absolute top-0 right-0 bg-emerald-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-bl-lg">ประหยัดสุด 🏆</div>
                                        <div>
                                            <h3 className="font-bold text-emerald-800 mb-1 text-sm">🏔️ Avalanche</h3>
                                            <p className="text-[11px] text-emerald-600 mb-3">โปะดอกแพงสุดก่อน</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] uppercase font-bold text-emerald-600/70">หมดหนี้ใน</p>
                                            <p className="font-black text-sm text-emerald-800">{getAbsoluteDate(results.avalanche.months)}</p>
                                            <p className="text-[10px] text-emerald-600 font-bold mt-1">ดอกเบี้ย: {formatMoney(results.avalanche.totalInterest)}</p>
                                        </div>
                                    </div>

                                </div>

                                {/* Graph Visualization */}
                                {!results.minimum.isInfinite && chartData.length > 0 && (
                                    <div className="pt-4 border-t border-slate-100">
                                        <h3 className="text-sm font-bold text-slate-700 mb-4">📈 กราฟจำลองยอดหนี้คงเหลือเทียบ 3 กลยุทธ์</h3>
                                        <div className="h-64 w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={chartData} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                    <XAxis dataKey="month" tick={{fontSize: 10, fill: '#94a3b8'}} axisLine={false} tickLine={false} tickFormatter={(m) => `เดือนที่ ${m}`}/>
                                                    <YAxis tick={{fontSize: 10, fill: '#94a3b8'}} axisLine={false} tickLine={false} tickFormatter={(val) => `฿${(val/1000)}k`} />
                                                    <Tooltip 
                                                        formatter={(value) => formatMoney(value)}
                                                        labelFormatter={(label) => `เดือนที่ ${label}`}
                                                        contentStyle={{borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)'}}
                                                    />
                                                    <Legend wrapperStyle={{fontSize: 11, paddingTop: '10px'}} />
                                                    <Line type="monotone" name="จ่ายขั้นต่ำ" dataKey="จ่ายขั้นต่ำ" stroke="#f43f5e" strokeWidth={2} dot={false} strokeDasharray="4 4" />
                                                    <Line type="monotone" name="Snowball" dataKey="Snowball (ก้อนเล็ก)" stroke="#f59e0b" strokeWidth={2.5} dot={false} />
                                                    <Line type="monotone" name="Avalanche" dataKey="Avalanche (ดอกแพง)" stroke="#10b981" strokeWidth={3} dot={false} />
                                                    <ReferenceLine y={0} stroke="#94a3b8" />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="bg-slate-50 p-12 rounded-3xl border-2 border-dashed border-slate-200 text-center">
                                <div className="text-5xl mb-4">🧾</div>
                                <h3 className="text-lg font-bold text-slate-700 mb-2">ยังไม่มีข้อมูลหนี้</h3>
                                <p className="text-sm text-slate-500">กรอกรายการหนี้ทางฝั่งซ้ายเพื่อดูเปรียบเทียบกลยุทธ์ Snowball และ Avalanche ได้เลยครับ</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
